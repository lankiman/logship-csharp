name: Publish to NuGet

# Runs when you push a version tag, for example: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets this job ask GitHub for a short-lived identity token (used by NuGet/login)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # v0.2.0 -> 0.2.0
      - name: Work out the version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=$VERSION

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack logship --no-build --configuration Release -p:Version=$VERSION --output artifacts

      # Trades GitHub's identity token for a temporary NuGet API key (valid for 1 hour).
      # Do this right before pushing. NUGET_USER is your nuget.org profile name, not your email.
      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
